<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive chronology of the life of Jesus.">
    <title>Christ | A Life in Chronology</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scroll-wrapper">
    <header class="app-header">
        <div class="container">
            <h1 class="logo">Christ</h1>
            <p class="subtitle">The Narrative Timeline</p>
        </div>
    </header>

    <main>
        <div class="container">
            <section id="timeline-container" class="timeline">
                </section>
        </div>
    </main>

    <div id="event-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-content">
            <button class="close-btn" aria-label="Close details">&times;</button>
            <figure class="modal-hero">
                <img src="" alt="" id="modal-image">
            </figure>
            <div class="modal-body">
                <span id="modal-date" class="meta-date"></span>
                <h2 id="modal-title" class="serif-title"></h2>
                <p id="modal-description"></p>
                <div id="modal-scripture" class="scripture-ref"></div>
            </div>
        </div>
    </div>

    <template id="timeline-item-template">
        <article class="timeline-item">
            <div class="timeline-marker"></div>
            <div class="timeline-content">
                <span class="date-badge"></span> <h3 class="event-title"></h3>
                <p class="event-snippet"></p>
                <div class="read-more-btn">Explore</div>
            </div>
        </article>
    </template>

    <script src="data.js" defer></script> <script src="app.js" defer></script>  
</div>
</body>
</html>
